const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw,payload){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(payload.salt),iterations:payload.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(payload.iv)},key,b64(payload.ct));
  return new TextDecoder().decode(buf);
}
let frame=null, curCt=null, pwMem=null;
function show(html,ct){
  curCt=ct;
  let st=null;
  if(!frame){
    document.body.innerHTML="";
    frame=document.createElement("iframe");document.body.appendChild(frame);
  }else{
    // 자동 갱신 때 보던 탭·트레이드 날짜·스크롤 위치를 기억해 새 화면에 되돌린다.
    try{const w=frame.contentWindow;st={tab:w.__tab,td:w.__tradeDate,y:w.scrollY};}catch(e){}
  }
  if(st){
    frame.onload=()=>{
      try{
        const w=frame.contentWindow;
        if(st.tab) w.showTab(st.tab);
        if(st.td && w.__setTradeDate) w.__setTradeDate(st.td,true);
        w.scrollTo(0,st.y||0);
      }catch(e){}
    };
  }
  frame.srcdoc=html;
}
// 열려 있는 동안 60초마다 새 암호문이 올라왔는지 확인해 자동으로 갱신(수동 새로고침 불필요).
async function poll(){
  try{
    const r=await fetch(location.href.split("#")[0].split("?")[0]+"?t="+Date.now(),{cache:"no-store"});
    const m=(await r.text()).match(/let P=(\{.*?\});/s);
    if(!m) return;
    const np=JSON.parse(m[1]);
    if(np.ct===curCt) return;
    const html=await open_(pwMem,np);
    show(html,np.ct);
  }catch(e){}
}
async function unlock(pw){
  const html=await open_(pw,P);
  pwMem=pw;
  try{sessionStorage.setItem("fp",pw);}catch(e){}
  show(html,P.ct);
  setInterval(poll,60000);
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const m=document.getElementById("msg");m.textContent="확인 중...";
  try{await unlock(document.getElementById("pw").value);}
  catch(err){m.textContent="비밀번호가 맞지 않아요";}
});
// 같은 탭에서 이미 한 번 연 적이 있으면 비밀번호를 다시 묻지 않는다(탭을 닫으면 삭제).
try{const s=sessionStorage.getItem("fp");if(s){unlock(s).catch(()=>{});}}catch(e){}
</script></body></html>
