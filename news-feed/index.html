const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));
  return new TextDecoder().decode(buf);
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const m=document.getElementById("msg");m.textContent="확인 중...";
  try{
    const html=await open_(document.getElementById("pw").value);
    document.body.innerHTML="";
    const fr=document.createElement("iframe");fr.srcdoc=html;document.body.appendChild(fr);
  }catch(err){m.textContent="비밀번호가 맞지 않아요";}
});
